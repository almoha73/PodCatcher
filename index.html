<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Podcatcher - Premium Audio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>Podcatcher</h1>
            </div>
            <div class="podcast-list" id="podcast-list">
                <!-- Podcasters will be injected here -->
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2 id="current-podcast-title">Mes Podcasts</h2>
                <button class="btn mobile-only" id="menu-toggle" style="display: none;">
                    <i data-lucide="menu"></i>
                </button>
            </header>
            <div class="episode-grid" id="episode-grid">
                <div class="loader">Sélectionnez un podcast pour voir les épisodes...</div>
            </div>
        </main>
    </div>

    <footer class="player-bar">
        <div class="current-track">
            <img src="https://via.placeholder.com/60" alt="Cover" class="track-img" id="player-img">
            <div class="track-details">
                <div class="track-name" id="player-title">Aucun podcast</div>
                <div class="track-author" id="player-author">Prêt à écouter</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn" id="btn-prev"><i data-lucide="skip-back"></i></button>
                <button class="btn btn-play" id="btn-play"><i data-lucide="play"></i></button>
                <button class="btn" id="btn-next"><i data-lucide="skip-forward"></i></button>
            </div>
            <div class="p-bar-container">
                <span class="time" id="time-current">0:00</span>
                <div class="progress-bar" id="progress-container">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="time" id="time-total">0:00</span>
            </div>
        </div>

        <div class="volume-control">
            <i data-lucide="volume-2"></i>
            <div class="progress-bar" style="width: 100px;">
                <div class="progress-fill" style="width: 80%;"></div>
            </div>
        </div>
    </footer>

    <audio id="audio-player"></audio>

    <script src="app.js"></script>
</body>

</html>
